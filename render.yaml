databases:
  - name: arctic-whale-db
    plan: free
    databaseName: arctic_whale
    user: arctic_whale

services:
  - type: web
    name: arctic-whale-agent-service
    runtime: node
    rootDir: agent_service
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: AGENT_SERVICE_PORT
        value: "10000"         # Render assigns $PORT; use that instead
      - key: PORT
        value: "10000"
      - key: TRADE_DRY_RUN
        value: "false"
      - key: AGENT_SERVICE_SECRET
        sync: false
      - key: CIRCLE_SELLER_ADDRESS
        sync: false
      - key: X402_FACILITATOR_URL
        value: "https://x402.org/facilitator"
      - key: PYTHON_BACKEND_URL
        sync: false            # Set to arctic-whale-api Render URL after first deploy

  # NOTE: Trade cycles do NOT run in this service. They run in GitHub Actions
  # (.github/workflows/trade-cycle.yml) directly against the DATABASE_URL below,
  # so this service can sleep on the free tier without missing trades.
  - type: web
    name: arctic-whale-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TRADE_DRY_RUN
        value: "false"
      - key: AGENT_DEV_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: arctic-whale-db
          property: connectionString
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: AGENT_WALLET_ID
        sync: false
      - key: AGENT_WALLET_ADDRESS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false            # CoinGecko demo key - avoids 429s from the unauthenticated public tier
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_CLIENT_ID
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: AGENT_SERVICE_URL
        sync: false            # Set to the arctic-whale-agent-service URL after first deploy
      - key: AGENT_SERVICE_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # Set per environment; include the matching Vercel URL
      - key: PRIVY_AUTH_ORIGIN
        sync: false            # Set to the matching Vercel URL for this environment
      - key: PARENT_WALLET_ID
        sync: false            # Optional treasury wallet for signup funding
      - key: USER_WALLET_SIGNUP_FUND_AMOUNT
        sync: false            # Set > 0 only if you want auto-funding on signup
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      # The Telegram bot runs as a webhook route on THIS service now (see
      # backend/telegram_bot.py) instead of a separate long-polling worker —
      # Render's Background Worker plans aren't free, and a webhook rides
      # for free on a web service that's already deployed. PYTHON_BACKEND_URL
      # must be this service's own public Render URL so the app can register
      # its webhook with Telegram on startup.
      - key: PYTHON_BACKEND_URL
        sync: false            # Set to this service's own Render URL after first deploy
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false            # Verifies incoming webhook POSTs actually came from Telegram
