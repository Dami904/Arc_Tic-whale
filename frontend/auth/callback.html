<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signing in…</title>
    <script src="/static/runtime-config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #07090f;
            color: #aaa;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 14px;
        }
        .card {
            background: #10131d;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 32px 28px;
            max-width: 340px;
            width: 90%;
            text-align: center;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(0,229,198,0.2);
            border-top-color: #00e5c6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #aaa; font-size: 14px; line-height: 1.5; }
        .err-icon { font-size: 36px; margin-bottom: 14px; }
        .err-title { color: #f87171; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
        .err-body { color: #aaa; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
        .err-hint {
            background: rgba(248,113,113,0.08);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #f87171;
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 18px;
        }
        .btn-close {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255,255,255,0.06);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-close:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Completing sign-in…</div>
    </div>
    <script type="module">
        import * as PrivyAuth from '/static/privy-bundle.mjs';

        const cardEl   = document.getElementById('card');
        const spinEl   = document.getElementById('spinner');
        const statusEl = document.getElementById('status');

        function showError(title, body, hint) {
            spinEl.style.display = 'none';
            cardEl.innerHTML = `
                <div class="err-icon">⚠️</div>
                <div class="err-title">${title}</div>
                <div class="err-body">${body}</div>
                ${hint ? `<div class="err-hint">${hint}</div>` : ''}
                <a class="btn-close" href="javascript:window.close()">Close window</a>
            `;
        }

        async function finish() {
            const appId    = window.PRIVY_APP_ID;
            const clientId = window.PRIVY_CLIENT_ID;

            if (!PrivyAuth.isPrivyConfigured(appId, clientId)) {
                showError(
                    'Privy not configured',
                    'The app is missing its Privy app or client ID.',
                    'Check that <code>PRIVY_APP_ID</code> and <code>PRIVY_CLIENT_ID</code> are set in your <code>.env</code> file.'
                );
                return;
            }

            try {
                await PrivyAuth.initPrivy(appId, clientId);
                const { userId, token, email } = await PrivyAuth.completeOAuthFromCallback();

                if (window.opener) {
                    window.opener.postMessage(
                        { type: 'privy_oauth_token', token, userId, email },
                        (window.PRIVY_AUTH_ORIGIN || window.location.origin || '*').replace(/\/+$/, ''),
                    );
                    window.close();
                    return;
                }

                // Fallback: tab mode (popup was blocked) - store and redirect
                localStorage.setItem('privy_access_token', token);
                localStorage.setItem('privy_user_id', userId);
                if (email) localStorage.setItem('privy_user_email', email);
                window.location.href = '/webapp';

            } catch (err) {
                const msg = String(err && err.message ? err.message : err || '');

                if (/already linked/i.test(msg) || /linked.*another/i.test(msg)) {
                    showError(
                        'Account already linked',
                        'This social account is already linked to a different user on this platform.',
                        '💡 <strong>What to do:</strong> Try signing in with <strong>Google</strong> or <strong>email OTP</strong> instead. If you previously created an account with a different method, use that same method to log back in.'
                    );
                } else if (/origin/i.test(msg) || /allowed/i.test(msg)) {
                    showError(
                        'Origin not whitelisted',
                        'This URL is not allowed in your Privy app settings.',
                        'Add this domain to your Privy Dashboard → Settings → Allowed Origins.'
                    );
                } else {
                    showError(
                        'Sign-in failed',
                        msg || 'An unexpected error occurred during social login.',
                        'Close this window and try again, or use email sign-in instead.'
                    );
                }
            }
        }

        finish();
    </script>
</body>
</html>
