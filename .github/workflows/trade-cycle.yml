name: Trade Cycle

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 min (UTC), offset from :00/:15/:30/:45 to avoid congestion
  workflow_dispatch: {}      # manual trigger for testing

permissions: {}

concurrency:
  group: trade-cycle
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
      CIRCLE_ENTITY_SECRET: ${{ secrets.CIRCLE_ENTITY_SECRET }}
      AGENT_WALLET_ID: ${{ secrets.AGENT_WALLET_ID }}
      AGENT_WALLET_ADDRESS: ${{ secrets.AGENT_WALLET_ADDRESS }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TRADE_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_cycle.py
