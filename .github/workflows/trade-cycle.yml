name: Trade Cycle

on:
  # GitHub's `schedule` trigger is best-effort - under load it delays or
  # silently drops runs, so a 15-min cron alone was landing 1-3 hours apart
  # in practice. Firing every 5 min (GitHub's minimum granularity) raises the
  # odds that at least one attempt lands close to on time; run_cycle.py's
  # MIN_CYCLE_SECONDS floor skips the extra attempts so the real trading
  # cadence stays ~15 min instead of firing 3x too often.
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"  # every 5 min (UTC), offset from :00/:30
  workflow_dispatch: {}      # manual trigger for testing

permissions: {}

concurrency:
  group: trade-cycle
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
      CIRCLE_ENTITY_SECRET: ${{ secrets.CIRCLE_ENTITY_SECRET }}
      AGENT_WALLET_ID: ${{ secrets.AGENT_WALLET_ID }}
      AGENT_WALLET_ADDRESS: ${{ secrets.AGENT_WALLET_ADDRESS }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TRADE_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_cycle.py
